services:
  personalpage:
    container_name: personalpage
    image: kidilias/personalpage:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Required by SvelteKit for form actions / CSRF checks behind the reverse proxy
      ORIGIN: ${ORIGIN:-https://schaut.dev}
    ports:
      - '${PORT:-3000}:3000'
