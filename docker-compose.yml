services:
  personalpage:
    container_name: personalpage
    image: kidilias/personalpage:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
    ports:
      - '${PORT:-3000}:3000'
