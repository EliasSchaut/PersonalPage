services:
  personalpage:
    container_name: personalpage
    # Built and pushed by CI on every push to main (see .github/workflows/ci.yml);
    # the deploy webhook then pulls and restarts: docker compose pull && docker compose up -d
    image: kidilias/personalpage:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Required by SvelteKit for form actions / CSRF checks behind the reverse proxy
      ORIGIN: ${ORIGIN:-https://schaut.dev}
    ports:
      - '${PORT:-3000}:3000'
