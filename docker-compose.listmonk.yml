# Newsletter backend (Listmonk + Postgres). Runs as its own stack next to the site:
#   docker compose -f docker-compose.listmonk.yml up -d
# Reads LISTMONK_* from .env like the main stack.
services:
  listmonk:
    container_name: listmonk
    image: listmonk/listmonk:latest
    restart: unless-stopped
    depends_on:
      listmonk-db:
        condition: service_healthy
    ports:
      - '${LISTMONK_PORT:-9000}:9000'
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_app__root_url: ${LISTMONK_URL:-https://news.schaut.dev}
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:-listmonk}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      TZ: Europe/Berlin
    # First start initialises the schema; subsequent starts upgrade it if needed.
    command:
      [
        sh,
        -c,
        "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''",
      ]
    volumes:
      - listmonk-uploads:/listmonk/uploads

  listmonk-db:
    container_name: listmonk-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:-listmonk}
      POSTGRES_DB: listmonk
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U listmonk']
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - listmonk-data:/var/lib/postgresql/data

volumes:
  listmonk-data:
  listmonk-uploads:
